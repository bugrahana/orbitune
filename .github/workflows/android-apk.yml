name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www/icons
          cp index.html styles.css app.js facts.js pets.js manifest.webmanifest sw.js www/
          cp icons/*.png www/icons/

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"
            NAME="${RAW#v}"
            TAG="${RAW}"
            TITLE="Orbitune v${NAME}"
            PRERELEASE=false
          else
            NAME="0.0.0-dev.${{ github.run_number }}"
            TAG="dev-${{ github.run_number }}"
            TITLE="Orbitune dev build ${{ github.run_number }}"
            PRERELEASE=true
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap copy android

      - name: Set app version
        working-directory: android/app
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Add background audio permissions
        working-directory: android/app/src/main
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' AndroidManifest.xml
          grep -E "FOREGROUND_SERVICE_MEDIA_PLAYBACK|WAKE_LOCK|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" AndroidManifest.xml

      - name: Keep playback alive when backing out, request notification permission natively
        run: |
          mkdir -p android/app/src/main/java/com/orbitune/app
          cat > android/app/src/main/java/com/orbitune/app/MainActivity.java <<'EOF'
          package com.orbitune.app;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Needed for the lock-screen/notification media controls to be allowed to
                  // show at all on Android 13+. Requested here directly instead of via
                  // @capacitor/local-notifications, which would also pull in
                  // RECEIVE_BOOT_COMPLETED and SCHEDULE_EXACT_ALARM for scheduling features
                  // this app never uses.
                  if (Build.VERSION.SDK_INT >= 33
                      && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[] { Manifest.permission.POST_NOTIFICATIONS }, 1001);
                  }

                  // Some OEMs (Xiaomi/MIUI, Samsung, Oppo, Vivo, ...) kill background apps
                  // more aggressively than stock Android even with a correct foreground
                  // service - verified on an emulator that the notification/media session
                  // survive backgrounding/BACK, so a report of it disappearing on a real
                  // device is almost always this. Ask once per install, not on every launch.
                  SharedPreferences prefs = getSharedPreferences("orbitune_bg_setup", MODE_PRIVATE);
                  if (!prefs.getBoolean("asked", false)) {
                      prefs.edit().putBoolean("asked", true).apply();
                      requestBatteryExemption();
                      if (isKnownAggressiveOem()) {
                          // Several big-name OEMs layer their own background-kill system on
                          // top of stock Android's, which the standard battery-optimization
                          // exemption above does not cover at all, and none of them publish
                          // an official API for it. Delay so the two system dialogs don't
                          // collide/get dropped by Android's background-activity rate limit.
                          new Handler(Looper.getMainLooper()).postDelayed(this::openOemAutoStartSettings, 1500);
                      }
                  }
              }

              private void requestBatteryExemption() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                      try {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      } catch (Exception e) {
                          // Some OEMs block this intent entirely; nothing more we can do from here.
                      }
                  }
              }

              private boolean isKnownAggressiveOem() {
                  if (Build.MANUFACTURER == null) return false;
                  String m = Build.MANUFACTURER.toLowerCase();
                  return m.equals("xiaomi") || m.equals("huawei") || m.equals("honor") || m.equals("oppo")
                      || m.equals("oneplus") || m.equals("realme") || m.equals("vivo") || m.equals("letv")
                      || m.equals("asus") || m.equals("meizu");
              }

              private void openOemAutoStartSettings() {
                  // Undocumented per-OEM "autostart"/"protected apps" screens - none of
                  // these manufacturers publish an official API, so this is a best-effort
                  // catalog (same class names most background-audio/VoIP apps rely on).
                  // Falls back to this app's own system settings page if every candidate
                  // for this manufacturer is missing/renamed on a given firmware version.
                  String m = Build.MANUFACTURER == null ? "" : Build.MANUFACTURER.toLowerCase();
                  String[][] candidates;
                  if (m.equals("xiaomi")) {
                      candidates = new String[][] {
                          { "com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity" },
                      };
                  } else if (m.equals("huawei") || m.equals("honor")) {
                      candidates = new String[][] {
                          { "com.huawei.systemmanager", "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity" },
                          { "com.huawei.systemmanager", "com.huawei.systemmanager.optimize.process.ProtectActivity" },
                      };
                  } else if (m.equals("oppo") || m.equals("oneplus") || m.equals("realme")) {
                      candidates = new String[][] {
                          { "com.coloros.safecenter", "com.coloros.safecenter.permission.startup.StartupAppListActivity" },
                          { "com.coloros.safecenter", "com.coloros.safecenter.startupapp.StartupAppListActivity" },
                          { "com.oppo.safe", "com.oppo.safe.permission.startup.StartupAppListActivity" },
                      };
                  } else if (m.equals("vivo")) {
                      candidates = new String[][] {
                          { "com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity" },
                          { "com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity" },
                      };
                  } else if (m.equals("letv")) {
                      candidates = new String[][] {
                          { "com.letv.android.letvsafe", "com.letv.android.letvsafe.AutobootManageActivity" },
                      };
                  } else if (m.equals("asus")) {
                      candidates = new String[][] {
                          { "com.asus.mobilemanager", "com.asus.mobilemanager.autostart.AutoStartActivity" },
                      };
                  } else if (m.equals("meizu")) {
                      candidates = new String[][] {
                          { "com.meizu.safe", "com.meizu.safe.permission.PermissionMainActivity" },
                      };
                  } else {
                      candidates = new String[0][];
                  }

                  for (String[] c : candidates) {
                      try {
                          Intent intent = new Intent();
                          intent.setClassName(c[0], c[1]);
                          startActivity(intent);
                          return;
                      } catch (Exception ignored) {
                          // try the next candidate for this manufacturer
                      }
                  }
                  try {
                      Intent fallback = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      fallback.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(fallback);
                  } catch (Exception ignored) {}
              }

              // Default Capacitor behaviour finishes (destroys) the Activity when the
              // back button is pressed at the root screen. That tears down app.js and
              // every JS-side plugin instance while the native audio player (which
              // isn't tied to the Activity) keeps playing - leaving it orphaned, with
              // no way for the next launch's fresh plugin instance to reach it. Mirror
              // the Home button instead: only actually go back if there's in-app
              // history (closing a sheet/panel) to go back to.
              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null && getBridge().getWebView().canGoBack()) {
                      super.onBackPressed();
                  } else {
                      moveTaskToBack(true);
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          DEST="android/app/build/outputs/apk/debug/Orbitune-${{ steps.version.outputs.tag }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify background audio is wired into the built APK
        run: |
          AAPT=$(find "$ANDROID_HOME" -name aapt -type f | sort -V | tail -n1)
          "$AAPT" dump xmltree "${{ steps.apk.outputs.path }}" AndroidManifest.xml > /tmp/manifest-dump.txt
          echo "--- relevant manifest entries ---"
          grep -E "FOREGROUND_SERVICE|WAKE_LOCK|POST_NOTIFICATIONS|MediaSessionService|foregroundServiceType" /tmp/manifest-dump.txt || true
          fail=0
          for perm in FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK WAKE_LOCK POST_NOTIFICATIONS; do
            grep -q "android.permission.$perm" /tmp/manifest-dump.txt || { echo "::error::Missing permission in merged manifest: $perm"; fail=1; }
          done
          grep -q "MediaSessionService" /tmp/manifest-dump.txt || { echo "::error::MediaSessionService not found in merged manifest"; fail=1; }
          exit $fail

      - name: Audit the exact permission set (no silent additions from a plugin update)
        run: |
          grep -o 'android:name(0x01010003)="android\.permission\.[A-Za-z_.]*"' /tmp/manifest-dump.txt \
            | sed -E 's/.*"(android\.permission\.[A-Za-z_.]*)"/\1/' | sort -u > /tmp/actual-permissions.txt
          echo "--- permissions present in the merged manifest ---"
          cat /tmp/actual-permissions.txt
          cat > /tmp/allowed-permissions.txt <<'EOF'
          android.permission.ACCESS_NETWORK_STATE
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
          android.permission.WAKE_LOCK
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/allowed-permissions.txt
          sort -u /tmp/allowed-permissions.txt -o /tmp/allowed-permissions.txt
          echo "--- diff vs the expected set (< missing, > unexpected) ---"
          if ! diff /tmp/allowed-permissions.txt /tmp/actual-permissions.txt; then
            echo "::error::Permission set changed - a plugin update added or removed a permission. Review and update the allowlist in this workflow step deliberately."
            exit 1
          fi
          echo "Permission set matches exactly what's expected."

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ steps.version.outputs.prerelease }}
