name: Native Audio Smoke Test

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'feature/**'
    paths:
      - 'ci/smoke/**'
      - 'app.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/native-audio-smoketest.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install smoke-test harness dependencies
        working-directory: ci/smoke
        run: npm install

      - name: Generate a short local test tone (no external stream dependency)
        run: |
          mkdir -p ci/smoke/web/assets/sounds
          ffmpeg -f lavfi -i "sine=frequency=440:duration=3" -q:a 9 -acodec libmp3lame -y ci/smoke/web/assets/sounds/test.mp3

      - name: Add Android platform
        working-directory: ci/smoke
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: ci/smoke
        run: npx cap copy android

      - name: Add background audio permissions
        working-directory: ci/smoke/android/app/src/main
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' AndroidManifest.xml
          grep -E "FOREGROUND_SERVICE_MEDIA_PLAYBACK|WAKE_LOCK" AndroidManifest.xml

      - name: Build smoke-test debug APK
        working-directory: ci/smoke/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and verify background playback + lock-screen media session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            APK=$(find ci/smoke/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
            echo "Installing $APK"
            adb install -r "$APK"

            # Runtime POST_NOTIFICATIONS can't be tapped through a dialog headlessly; grant it directly.
            adb shell pm grant com.orbitune.smoketest android.permission.POST_NOTIFICATIONS || true

            adb shell am start -n com.orbitune.smoketest/.MainActivity
            echo "Waiting for the harness to start playback..."
            sleep 6

            echo "Sending the app to the background (HOME), the way a real user would while listening..."
            adb shell input keyevent KEYCODE_HOME
            sleep 10

            echo "--- dumpsys media_session ---"
            adb shell dumpsys media_session > media_session.txt
            cat media_session.txt

            echo "--- dumpsys notification (this app only) ---"
            adb shell dumpsys notification --noredact > notification_full.txt
            grep -A 30 "com.orbitune.smoketest" notification_full.txt > notification.txt || true
            cat notification.txt

            echo "--- dumpsys activity services (this app only) ---"
            adb shell dumpsys activity services com.orbitune.smoketest > services.txt
            cat services.txt

            fail=0

            grep -q "com.orbitune.smoketest" media_session.txt \
              || { echo "::error::No media session owned by the app was found after backgrounding"; fail=1; }
            grep -q "state=3" media_session.txt \
              || { echo "::error::Media session is not reporting PLAYING (state=3) after backgrounding - audio likely got suspended"; fail=1; }

            grep -q "com.orbitune.smoketest" notification.txt \
              || { echo "::error::No lock-screen/notification media card was posted while the app was backgrounded"; fail=1; }

            grep -qi "MediaSessionService" services.txt \
              || { echo "::error::MediaSessionService is not running - the foreground service never started"; fail=1; }
            grep -qi "isForeground=true" services.txt \
              || { echo "::error::The media session service is running but NOT as a foreground service - Android may kill it under memory pressure"; fail=1; }

            exit $fail

      - name: Upload diagnostic dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-dumps
          path: |
            media_session.txt
            notification_full.txt
            notification.txt
            services.txt
          if-no-files-found: ignore
